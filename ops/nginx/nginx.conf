events {
    worker_connections 1024;
}

http {

    resolver 127.0.0.11 ipv6=off valid=10s;

    # ── Rate Limit Zones ──
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=global_zone:10m rate=50r/s;

    limit_req_status 429;

    # ── Slowloris / timeout 방어 ──
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # ── Admin 전용 서버 블록 (서브도메인) ──
    server {
        listen 80;
        server_name admin.thaijaworld.com;

        client_max_body_size 20M;

        # Admin CMS API → FastAPI backend
        location /api/v1/ {
            limit_req zone=api_zone burst=30 nodelay;

            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Next.js 정적 파일
        location /_next/ {
            set $admin_upstream http://admin:3002;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin 나머지 → admin Next.js
        location / {
            limit_req zone=global_zone burst=50 nodelay;

            set $admin_upstream http://admin:3002;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Public 서버 블록 (기존) ──
    server {
        listen 80 default_server;
        server_name thaijaworld.com www.thaijaworld.com _;

        client_max_body_size 20M;

        # ── Auth 엔드포인트 (엄격) ──
        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=10 nodelay;

            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Next.js API 라우트 (auth 등) → web ──
        location /api/auth/ {
            limit_req zone=auth_zone burst=10 nodelay;

            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Next.js API 라우트 (shop 등) → web ──
        location /api/shop/ {
            limit_req zone=api_zone burst=30 nodelay;

            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── FastAPI 엔드포인트 ──
        location /api/v1/ {
            limit_req zone=api_zone burst=30 nodelay;

            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 나머지 /api/ → web (Next.js API routes) ──
        location /api/ {
            limit_req zone=api_zone burst=30 nodelay;

            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Healthcheck (rate limit 없음) ──
        location = /api/v1/health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Admin under /admin path ──
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            limit_req zone=global_zone burst=50 nodelay;

            set $admin_upstream http://admin:3002;
            rewrite ^/admin(/.*)$ $1 break;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/_next/ {
            set $admin_upstream http://admin:3002;
            rewrite ^/admin(/.*)$ $1 break;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_next/ {
            limit_req zone=global_zone burst=50 nodelay;

            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=global_zone burst=50 nodelay;

            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
