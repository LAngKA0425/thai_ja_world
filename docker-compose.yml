name: taeja-world

services:
  postgres:
    image: postgres:16-alpine
    networks:
      - app
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taeja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-taeja}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taeja"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - app
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./app/backend
    networks:
      - app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taeja}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-taeja}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-taeja}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-taeja}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/api/v1/health'); sys.exit(0) if r.status == 200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    build: ./app/backend
    networks:
      - app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taeja}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-taeja}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-taeja}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-taeja}
      REDIS_URL: redis://redis:6379/0
    command: celery -A src.core.api.v1.domain.workers.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ./app/backend
    networks:
      - app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taeja}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-taeja}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-taeja}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-taeja}
      REDIS_URL: redis://redis:6379/0
    command: celery -A src.core.api.v1.domain.workers.celery_app beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    networks:
      - app
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
      - BACKEND_INTERNAL_URL=http://backend:8000
      - BACKEND_INTERNAL_SECRET=${BACKEND_INTERNAL_SECRET:-${SECRET_KEY:-super-secret-change-me-in-production}}
      - SECRET_KEY=${SECRET_KEY:-super-secret-change-me-in-production}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-production}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      backend:
        condition: service_healthy
      socket-server:
        condition: service_started
    restart: unless-stopped

  socket-server:
    build:
      context: .
      dockerfile: apps/socket-server/Dockerfile
    networks:
      - app
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - PORT=3001
      - CORS_ORIGIN=${SOCKET_CORS_ORIGIN:-http://localhost:3000}
      - JWT_SECRET=${SECRET_KEY}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    networks:
      - app
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    networks:
      - app
    ports:
      - "80:80"
      - "8082:8082"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:

networks:
  app:
    driver: bridge
